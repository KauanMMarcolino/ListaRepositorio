<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        fieldset{
            width: 400px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>DEIXE SEU COMENTARIO</h1>
    <form action="respformulario.html" id="formulario" method="post">
            <fieldset>
                <label for="lbNome">Digite seu nome:</label>
                <input type="text" id="ipNome" name="ipNome"><br><br>

                <label for="lbEmail">Digite seu Email:</label>
                <input type="email" id="ipEmail" name="ipEmail" required><br><br>

                <label for="lbWebsite">Digite seu Website:</label>
                <input type="url" id="ipWebsite" name="ipWebsite"><br><br>

                <label for="lbMensagem">Digite sua Mensagem:</label>
                <textarea name="mensagem" id="mensagem" rows="5"></textarea><br><br>
                <h5>Observação: Seu comentário será publicado após passar pela moderação</h5>
                <input type="submit" value="Enviar Comentário">
            </fieldset>
        </form>
        <a href="index.html">Voltar</a>
</body>
</html>
