<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Blog do Fulano</title>

    <!-- Favicon -->
    <link rel="icon" href="imagens/logoFavicon.ico">

    <style>
    header img {
        width: 120px;
    }

    section img {
        width: 300px;
    }
</style>

</head>
<body>

    <!-- Logo -->
    <header>
        <img src="imagens/logo.png" alt="Logo do Blog Fulano" title="Blog do Fulano">
        <h1>Bem-vindo ao Blog do Fulano</h1>
    </header>

    <!-- Imagem com alt e title -->
    <section>
        <h2>Imagem destaque</h2>
        <img src="imagens/imagemilustrativa.png" alt="Imagem ilustrativa do blog" title="Imagem principal do blog">
    </section>

    <!-- Lista ordenada em números romanos -->
    <section>
        <h2>Conteúdos do Blog</h2>
        <ol type="I">
            <li>Sobre mim</li>
            <li>Projetos</li>
            <li>Contato</li>
        </ol>
    </section>

    <!-- Link para outra página -->
    <footer>
        <a href="paginas/curriculo.html">Ver currículo</a>
    </footer>

</body>
</html>
